version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

sphinx:
  configuration: docs/source/conf.py

# Only the docs toolchain is installed; eykthyr's runtime deps are mocked in conf.py
python:
  install:
    - requirements: requirements.txt
